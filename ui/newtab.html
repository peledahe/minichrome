<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Pestaña — Mini Browser</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="theme.js"></script>
    <style>
        :root {
            --bg: #07070c;
            --accent: #6c5ce7;
            --accent2: #a29bfe;
            --glass: rgba(255,255,255,0.05);
            --glass-border: rgba(255,255,255,0.1);
            --text: #ffffff;
            --text-muted: rgba(255,255,255,0.45);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: thin; scrollbar-color: rgba(108, 92, 231, 0.35) transparent; }

        ::-webkit-scrollbar { width: 2px; height: 2px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(108, 92, 231, 0.45); border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(108, 92, 231, 0.8); }
        ::-webkit-scrollbar-corner { background: transparent; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 20% 30%, rgba(108,92,231,0.18) 0%, transparent 70%),
                radial-gradient(ellipse 50% 35% at 80% 70%, rgba(0,184,148,0.10) 0%, transparent 70%),
                radial-gradient(ellipse 40% 30% at 60% 20%, rgba(253,121,168,0.08) 0%, transparent 70%);
            animation: bgPulse 8s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes bgPulse {
            from { opacity: 0.7; transform: scale(1); }
            to   { opacity: 1;   transform: scale(1.04); }
        }

        body > * { position: relative; z-index: 1; }

        .header { text-align: center; }

        .greeting {
            font-size: 0.85rem;
            font-weight: 300;
            color: var(--text-muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .logo-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .logo-text img { height: 38px; width: auto; opacity: 0.92; display: block; }
        .logo-text .app-name strong {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #a29bfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-wrap { width: 720px; max-width: 92vw; }

        .search-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 12px 20px;
            backdrop-filter: blur(20px);
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108,92,231,0.2);
        }

        .search-box input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            color: var(--text);
        }

        .search-box input::placeholder { color: var(--text-muted); }

        .search-clear-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: rgba(255,255,255,0.35);
            display: none;
            align-items: center;
            border-radius: 6px;
            transition: color 0.15s, background 0.15s;
            flex-shrink: 0;
        }
        .search-clear-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .search-clear-btn.visible { display: flex; }

        .search-btn {
            background: var(--accent);
            border: none;
            border-radius: 10px;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            flex-shrink: 0;
        }
        .search-btn:hover { background: #8075f0; transform: scale(1.06); }
        .search-btn svg { fill: white; }

        .search-engines {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .engine-chip {
            font-size: 0.68rem;
            color: var(--text-muted);
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            padding: 0 10px 0 8px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            letter-spacing: 0.01em;
        }
        .engine-chip img {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            object-fit: cover;
            display: block;
            flex-shrink: 0;
        }
        .engine-chip .chip-label { line-height: 1; }
        .engine-chip:hover, .engine-chip.active {
            color: var(--accent2);
            border-color: var(--accent);
            background: rgba(108,92,231,0.12);
        }

        .app-cards { display: flex; gap: 10px; }

        .app-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px 18px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
            min-width: 80px;
            backdrop-filter: blur(16px);
        }

        .app-card:hover {
            transform: translateY(-3px) scale(1.04);
            border-color: var(--accent);
            box-shadow: 0 8px 28px rgba(108,92,231,0.25);
            background: rgba(108,92,231,0.1);
        }

        .app-card .icon-wrap {
            width: 38px; height: 38px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
        }

        .app-card .icon-wrap.video   { background: linear-gradient(135deg,#6c5ce7,#a29bfe); }
        .app-card .icon-wrap.agenda  { background: linear-gradient(135deg,#00b894,#00cec9); }
        .app-card .icon-wrap.pagos   { background: linear-gradient(135deg,#fd79a8,#e84393); }
        .app-card .icon-wrap.images  { background: linear-gradient(135deg,#00b894,#55efc4); }
        .app-card .icon-wrap.kanban  { background: linear-gradient(135deg,#fdcb6e,#e17055); }
        .app-card .icon-wrap.notas   { background: linear-gradient(135deg,#74b9ff,#0984e3); }
        .app-card .icon-wrap.ojitos   { background: linear-gradient(135deg,#a29bfe,#6c5ce7); }
        .app-card .icon-wrap.arcade    { background: linear-gradient(135deg,#fd79a8,#e17055); }
        .app-card .icon-wrap.passwords { background: linear-gradient(135deg,#6c5ce7,#00cec9); }

        .app-card span {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }

        /* Quick links area */
        .quick-links-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 900px;
            max-width: 92vw;
        }

        .quick-links {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-height: calc(2 * 24px + 10px); /* 2 filas: 24+6+24 = 54px + margen */
            overflow: hidden;
        }

        .quick-link {
            position: relative;
            display: flex;
            align-items: center;
            gap: 7px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            padding: 0 24px 0 10px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: all 0.2s;
            height: 24px;
            min-width: 72px;
            max-width: 155px;
        }

        .quick-link:hover {
            color: var(--text);
            border-color: rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.09);
            transform: translateY(-1px);
        }

        .quick-link img {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            object-fit: cover;
            display: block;
            flex-shrink: 0;
        }

        .quick-link > span:not(.ql-delete) {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 110px;
        }

        .quick-link .ql-delete {
            display: none;
            position: absolute;
            top: 50%;
            right: 6px;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(30,30,40,0.95);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.6);
            font-size: 8px;
            line-height: 1;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            z-index: 2;
        }

        .quick-link:hover .ql-delete { display: flex; }
        .quick-link .ql-delete:hover { background: rgba(255,59,48,0.85); color: #fff; border-color: transparent; }

        .ql-add-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 8px;
            background: var(--glass);
            border: 1px dashed rgba(255,255,255,0.18);
            color: rgba(255,255,255,0.35);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .ql-add-btn:hover {
            background: rgba(108,92,231,0.15);
            border-color: var(--accent);
            color: var(--accent2);
        }

        /* Modal */
        .ql-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .ql-modal-overlay.active { display: flex; }

        .ql-modal {
            background: #14141c;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 28px;
            width: min(380px, 90vw);
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.5);
        }

        .ql-modal h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
        }

        .ql-modal input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 9px 14px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.88rem;
            color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }
        .ql-modal input:focus { border-color: var(--accent); }
        .ql-modal input::placeholder { color: rgba(255,255,255,0.28); }

        .ql-url-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .ql-url-wrap input { padding-right: 38px; box-sizing: border-box; }
        .ql-paste-btn {
            position: absolute;
            right: 7px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
        }
        .ql-paste-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }

        .ql-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .ql-btn {
            padding: 8px 18px;
            border-radius: 9px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .ql-btn.primary { background: var(--accent); color: #fff; }
        .ql-btn.primary:hover { background: #8075f0; }
        .ql-btn.ghost { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.1); }
        .ql-btn.ghost:hover { background: rgba(255,255,255,0.1); color: #fff; }

        .ql-error {
            font-size: 0.78rem;
            color: #ff6b6b;
            display: none;
        }
        .ql-error.show { display: block; }

        /* Administrar buscadores */
        .engine-chip.engine-manage { padding: 0 7px; color: rgba(255,255,255,0.4); }
        .engine-chip.engine-manage:hover { color: var(--accent2); }
        .ql-modal.eng-modal { width: min(600px, 92vw); }
        .eng-hint { font-size: 0.78rem; color: rgba(255,255,255,0.45); margin-top: -8px; }
        .eng-hint code { color: var(--accent2); }
        .eng-list {
            display: flex; flex-direction: column; gap: 6px;
            max-height: 48vh; overflow-y: auto; padding-right: 4px;
        }
        .eng-row {
            display: grid;
            grid-template-columns: 16px 130px 1fr auto;
            gap: 8px; align-items: center;
        }
        .eng-row img { width: 16px; height: 16px; border-radius: 4px; }
        .ql-modal .eng-row input { padding: 6px 10px; font-size: 0.8rem; border-radius: 8px; }
        .ql-modal .eng-row.invalid input { border-color: #ff6b6b; }
        .eng-row-actions { display: flex; gap: 2px; }
        .eng-icon-btn {
            background: none; border: 1px solid transparent; border-radius: 6px;
            color: rgba(255,255,255,0.45); cursor: pointer; width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center; font-size: 0.8rem;
        }
        .eng-icon-btn:hover:not(:disabled) { color: #fff; background: rgba(255,255,255,0.08); }
        .eng-icon-btn.danger:hover:not(:disabled) { color: #ff6b6b; }
        .eng-icon-btn:disabled { opacity: 0.25; cursor: default; }
        .eng-add-btn {
            align-self: flex-start; background: none; border: 1px dashed rgba(255,255,255,0.18);
            border-radius: 8px; color: rgba(255,255,255,0.55); cursor: pointer;
            font-family: 'Outfit', sans-serif; font-size: 0.8rem; padding: 6px 12px;
        }
        .eng-add-btn:hover:not(:disabled) { color: var(--accent2); border-color: var(--accent); }
        .eng-add-btn:disabled { opacity: 0.35; cursor: default; }
        .ql-modal-actions .spacer { flex: 1; }

        /* Reloj */
        .clock-wrap {
            position: fixed;
            bottom: 86px;
            right: 74px;
            text-align: right;
            opacity: 0.48;
            z-index: 2;
            cursor: pointer;
            border-radius: 10px;
            padding: 4px 6px;
            transition: opacity 0.2s, background 0.2s;
        }
        .clock-wrap:hover { opacity: 0.9; background: var(--glass); }

        /* ---- Calendario de actividades ---- */
        .cal-overlay {
            display: none; position: fixed; inset: 0; z-index: 1100;
            background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
            align-items: center; justify-content: center;
        }
        .cal-overlay.active { display: flex; }
        .cal-detail-overlay { z-index: 1200; background: rgba(0,0,0,0.35); }
        .cal-modal, .cal-detail {
            --cal-bg: #14141c; --cal-cell: rgba(255,255,255,0.03); --cal-cell-hover: rgba(255,255,255,0.07);
            --cal-border: rgba(255,255,255,0.08); --cal-fg: #f3f4f6; --cal-muted: rgba(243,244,246,0.5);
            background: var(--cal-bg); color: var(--cal-fg);
            border: 1px solid var(--cal-border); border-radius: 18px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.45);
        }
        :root[data-theme='light'] .cal-modal, :root[data-theme='light'] .cal-detail {
            --cal-bg: #ffffff; --cal-cell: #f8fafc; --cal-cell-hover: #eef2ff;
            --cal-border: rgba(31,41,55,0.1); --cal-fg: #111827; --cal-muted: rgba(17,24,39,0.5);
            box-shadow: 0 24px 64px rgba(31,41,55,0.18);
        }
        .cal-modal {
            /* Ocupa toda la página visible (la barra del navegador se oculta mientras está abierto) */
            width: calc(100vw - 24px); height: calc(100vh - 24px);
            display: flex; flex-direction: column; padding: 18px 20px 14px; gap: 10px;
        }
        .cal-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .cal-header h3 { font-size: 1.15rem; font-weight: 600; min-width: 230px; text-align: center; }
        .cal-modal { position: relative; overflow: hidden; }
        .cal-views { display: inline-flex; border: 1px solid var(--cal-border); border-radius: 8px; overflow: hidden; }
        .cal-views button {
            background: var(--cal-cell); border: none; color: var(--cal-muted); font-family: inherit;
            font-size: 0.8rem; padding: 0 12px; height: 30px; cursor: pointer;
        }
        .cal-views button + button { border-left: 1px solid var(--cal-border); }
        .cal-views button:hover { color: var(--cal-fg); }
        .cal-views button.active { background: var(--accent); color: #fff; }
        .cal-grid .cal-day { cursor: pointer; }
        .cal-grid .cal-day:hover { background: var(--cal-cell-hover); }
        .cal-day.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
        .cal-alt { flex: 1; min-height: 0; display: none; }
        .cal-alt.active { display: flex; flex-direction: column; }

        /* Línea de tiempo (semana y panel del día) */
        .tl { display: flex; flex-direction: column; flex: 1; min-height: 0; --hour: 48px; }
        .tl-row { display: grid; grid-template-columns: 52px repeat(var(--cols), minmax(0, 1fr)); }
        .tl-head > div { text-align: center; padding: 4px 0 6px; font-size: 0.72rem; color: var(--cal-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .tl-head > div.day { cursor: pointer; border-radius: 8px; }
        .tl-head > div.day:hover { background: var(--cal-cell-hover); }
        .tl-head .num { display: block; font-size: 1.25rem; font-weight: 600; color: var(--cal-fg); letter-spacing: 0; }
        .tl-head .today .num { color: #fff; background: var(--accent); border-radius: 999px; width: 34px; height: 34px; line-height: 34px; margin: 2px auto 0; }
        .tl-allday { border-top: 1px solid var(--cal-border); border-bottom: 1px solid var(--cal-border); max-height: 30%; overflow-y: auto; flex-shrink: 0; }
        .tl-allday .lbl { font-size: 0.62rem; color: var(--cal-muted); padding: 6px 6px 0 0; text-align: right; }
        .tl-allday .col { padding: 4px 3px; display: flex; flex-direction: column; gap: 3px; border-left: 1px solid var(--cal-border); min-width: 0; min-height: 28px; }
        .tl-scroll { flex: 1; overflow-y: auto; min-height: 0; }
        .tl-grid { height: calc(24 * var(--hour)); }
        .tl-hours { position: relative; }
        .tl-hours span { position: absolute; right: 6px; font-size: 0.62rem; color: var(--cal-muted); transform: translateY(-50%); }
        .tl-col {
            position: relative; border-left: 1px solid var(--cal-border);
            background-image: repeating-linear-gradient(to bottom, var(--cal-border) 0 1px, transparent 1px var(--hour));
        }
        .tl-col.today { background-color: color-mix(in srgb, var(--accent) 6%, transparent); }
        .tl-ev {
            position: absolute; border-radius: 6px; padding: 2px 5px; font-size: 0.7rem; line-height: 1.25;
            overflow: hidden; cursor: pointer; box-sizing: border-box; color: var(--cal-fg);
            background: color-mix(in srgb, var(--c) 24%, var(--cal-bg)); border-left: 3px solid var(--c);
        }
        .tl-ev:hover { background: color-mix(in srgb, var(--c) 38%, var(--cal-bg)); z-index: 2; }
        .tl-ev .t { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tl-ev .h { color: var(--cal-muted); font-size: 0.64rem; white-space: nowrap; }
        .tl-now { position: absolute; left: 0; right: 0; height: 2px; background: #ef4444; z-index: 3; pointer-events: none; }
        .tl-now::before { content: ''; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }

        /* Panel lateral del día */
        .cal-drawer {
            position: absolute; top: 0; right: 0; bottom: 0; width: min(440px, 92%); z-index: 5;
            background: var(--cal-bg); border-left: 1px solid var(--cal-border);
            box-shadow: -18px 0 40px rgba(0,0,0,0.35); transform: translateX(105%); transition: transform 0.22s ease;
            display: flex; flex-direction: column; padding: 16px 14px 12px; gap: 10px; visibility: hidden;
        }
        .cal-drawer.open { transform: none; visibility: visible; }
        /* En pantallas anchas el calendario se reduce para no quedar tapado por el panel */
        @media (min-width: 1000px) {
            .cal-modal > :not(.cal-drawer) { transition: margin-right 0.22s ease; }
            .cal-modal.drawer-open > :not(.cal-drawer) { margin-right: min(440px, 40%); }
            .cal-drawer { width: min(440px, 40%); }
        }
        .cal-drawer-head { display: flex; align-items: center; gap: 6px; }
        .cal-drawer-head h4 { flex: 1; font-size: 1rem; font-weight: 600; }
        .cal-drawer-head h4::first-letter { text-transform: uppercase; }
        .cal-drawer .sub { font-size: 0.78rem; color: var(--cal-muted); margin-top: -4px; }
        .cal-drawer .section { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--cal-muted); }
        .cal-drawer .allday { display: flex; flex-direction: column; gap: 6px; max-height: 38%; overflow-y: auto; flex-shrink: 0; }

    <script>
        // ---- Reloj ----
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2,'0');
            const m = String(now.getMinutes()).padStart(2,'0');
            document.getElementById('clock-time').textContent = `${h}:${m}`;
            const dias  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
            const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
            document.getElementById('clock-date').textContent =
                `${dias[now.getDay()]}, ${now.getDate()} ${meses[now.getMonth()]}`;
        }
        updateClock();
        setInterval(updateClock, 10000);

        // ---- Saludo ----
        const hour = new Date().getHours();
        document.getElementById('greeting-text').textContent =
            hour < 12 ? 'Buenos días' : hour < 19 ? 'Buenas tardes' : 'Buenas noches';

        // ---- Comunicación con el webview padre ----
        function deskioAction(action) { console.log('MERKE_ACTION:' + action); }
        function deskioNavigate(url)  { window.location.href = url; }

        // ---- Quick Links ----
        const MAX_LINKS = 20;

        const DEFAULT_LINKS = [
            { name: 'YouTube', url: 'https://youtube.com' },
            { name: 'GitHub',  url: 'https://github.com' },
            { name: 'ChatGPT', url: 'https://chat.openai.com' },
            { name: 'Gemini',  url: 'https://gemini.google.com' },
            { name: 'Gmail',   url: 'https://gmail.com' },
        ];

        async function loadLinks() {
            // window._miniLinks es inyectado por Python desde quick_links.json
            if (window._miniLinks && Array.isArray(window._miniLinks)) {
                return window._miniLinks;
            }
            return DEFAULT_LINKS;
        }

        async function saveLinks(links) {
            // Enviar al backend Python via consola (WebPage.javaScriptConsoleMessage)
            window._miniLinks = links;
            console.log('MINICHROME_LINKS:' + JSON.stringify(links));
        }

        function domainFromUrl(url) {
            try {
                return new URL(url).hostname.replace(/^www\./i, '');
            } catch {
                return '';
            }
        }

        function faviconCandidatesFromUrl(url) {
            // Solo el origen (esquema + host + puerto): con ruta o #fragmento
            // Google devuelve el icono genérico, y el puerto hace falta para
            // sitios internos como https://host:7272.
            let origin;
            try { origin = new URL(url).origin; } catch { return []; }
            if (!origin || origin === 'null') return [];
            return [
                `https://www.google.com/s2/favicons?sz=64&domain_url=${encodeURIComponent(origin)}`,
                `${origin}/favicon.ico`,
            ];
        }

        function hashString(value) {
            let hash = 0;
            for (let i = 0; i < value.length; i += 1) {
                hash = ((hash << 5) - hash) + value.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash);
        }

        function createFallbackFavicon(label, seed = '') {
            const palette = ['#6c5ce7', '#00b894', '#0984e3', '#e17055', '#fd79a8', '#00cec9', '#fdcb6e'];
            const safeLabel = (label || '?').trim().charAt(0).toUpperCase() || '?';
            const bg = palette[seed ? hashString(seed) % palette.length : 0];
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
                    <rect width="32" height="32" rx="8" fill="${bg}"/>
                    <text x="16" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">${safeLabel}</text>
                </svg>
            `;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        }

        function setFaviconWithFallback(img, candidates, fallbackLabel = '') {
            if (!img) return;
            // La letra se ve de inmediato; el favicon real la reemplaza si carga.
            const letter = createFallbackFavicon(fallbackLabel, candidates[0] || fallbackLabel);
            img.onerror = null;
            img.src = letter;
            const token = String(Math.random());
            img.dataset.faviconToken = token;

            let idx = 0;
            const tryNext = () => {
                if (img.dataset.faviconToken !== token || idx >= candidates.length) return;
                const src = candidates[idx++];
                const probe = new Image();
                let done = false;
                const fail = () => { if (!done) { done = true; tryNext(); } };
                const timer = setTimeout(fail, 5000);  // servidor que no responde
                probe.onerror = () => { clearTimeout(timer); fail(); };
                probe.onload = () => {
                    clearTimeout(timer);
                    if (done) return;
                    // Google devuelve un globo genérico de 16px si el sitio no tiene favicon.

                    done = true;
                    if (img.dataset.faviconToken === token) img.src = src;
                };
                probe.src = src;
            };
            tryNext();

        const CAL_TYPES = {

        };
        const KANBAN_STATUS = ['Pendiente', 'En proceso', 'Bloqueada', 'Completada'];  // columnas 1..4
        const KANBAN_PRIORITY = { high: 'Alta', medium: 'Media', low: 'Baja' };
        const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

        const calState = {
            year: 0, month: 0, view: 'month', anchor: new Date(), drawerDay: '',
            events: [], undated: [], hidden: new Set(), error: '', google: null,
        };
        try {

        const calBridge = new Promise(resolve => {
            try {
                if (typeof QWebChannel === 'undefined' || !window.qt || !qt.webChannelTransport) return resolve(null);

        function calEl(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined && text !== null) e.textContent = String(text);
            return e;
        }

        function isoDate(value) {
            const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(value || '').trim());
            return m ? `${m[1]}-${m[2]}-${m[3]}` : '';
        }

        function toIso(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function toMinutes(hhmm) {
            const m = /^(\d{1,2}):(\d{2})/.exec(hhmm || '');
            return m ? Math.min(1440, Number(m[1]) * 60 + Number(m[2])) : 0;
        }

        function minutesLabel(min) {
            return `${String(Math.floor(min / 60) % 24).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;
        }

        function parseIso(iso) {
            const [y, m, d] = iso.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function addDays(date, n) { return new Date(date.getFullYear(), date.getMonth(), date.getDate() + n); }

        function mondayOf(date) { return addDays(date, -((date.getDay() + 6) % 7)); }

        function cap(text) { return text ? text.charAt(0).toUpperCase() + text.slice(1) : text; }

        function longDate(iso) {
            const [y, m, d] = iso.split('-').map(Number);
            return new Date(y, m - 1, d).toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }

        function money(value, currency) {
            const n = Number(value);
            if (!isFinite(n)) return '';
            const txt = n.toLocaleString('es', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            return currency ? `${currency} ${txt}` : txt;
        }

        function parseKanbanText(text) {
            // Mismo formato que la Agenda: Título | Descripción | Vence: YYYY-MM-DD | Prioridad: x | Etiquetas: a, b
            const r = { title: '', description: [], due: '', priority: 'medium', labels: [] };
            for (const part of String(text || '').split(' | ').map(p => p.trim())) {
                if (part.startsWith('Vence: ')) r.due = part.slice(7);
                else if (part.startsWith('Prioridad: ')) r.priority = part.slice(11).toLowerCase();
                else if (part.startsWith('Etiquetas: ')) r.labels = part.slice(11).split(',').map(l => l.trim()).filter(Boolean);
                else if (!r.title) r.title = part;
                else r.description.push(part);
            }
            r.description = r.description.join(' | ');
            return r;
        }

        async function loadCalendarData() {
            const py = await calBridge;
            if (!py) throw new Error('Sin conexión con la aplicación');
            const [agenda, shopping, income, ...kanbanCols] = await Promise.all([
                py.get_agenda(), py.get_shopping(), py.get_income(),
                ...[1, 2, 3, 4].map(col => py.get_kanban_cards(col)),
            ]);
            const events = [];
            (agenda || []).forEach(a => events.push({
                type: 'agenda', date: isoDate(a.dueDate), title: a.text || '(sin título)', done: !!a.done,
                status: a.done ? 'Completada' : 'Pendiente',
                fields: [['Etiqueta', a.tag], ['Notas', a.notes]],
            }));
            (shopping || []).forEach(s => events.push({
                type: 'shopping', date: isoDate(s.dueDate), title: s.text || '(sin título)', done: !!s.done,
                status: s.done ? 'Pagado' : 'Pendiente de pago',
                fields: [['Monto', money(s.value, s.currency)], ['Método de pago', s.paymentMethod], ['Notas', s.notes]],
            }));
            (income || []).forEach(i => events.push({
                type: 'income', date: isoDate(i.dueDate), title: i.text || '(sin título)', done: !!i.received,
                status: i.received ? 'Recibido' : 'Por recibir',
                fields: [['Monto', money(i.value, i.currency)], ['Notas', i.notes]],
            }));
            kanbanCols.forEach((cards, idx) => (cards || []).forEach(card => {
                const k = parseKanbanText(card.text);
                events.push({
                    type: 'kanban', date: isoDate(k.due), title: k.title || '(sin título)', done: idx === 3,
                    status: KANBAN_STATUS[idx] || '',
                    fields: [['Prioridad', KANBAN_PRIORITY[k.priority] || ''], ['Etiquetas', k.labels.join(', ')], ['Descripción', k.description]],
                });
            }));
            // Eventos de Google (caché local de la última sincronización); los de varios días se repiten por día
            const google = py.get_google_events ? JSON.parse(await py.get_google_events() || '[]') : [];
            google.forEach(g => {
                const start = isoDate(g.start), end = isoDate(g.end) || start;
                if (!start) return;
                let when = 'Todo el día';
                if (!g.allDay) when = g.start === g.end ? `${g.startTime} – ${g.endTime}` : `${g.startTime} (${longDate(start)}) – ${g.endTime} (${longDate(end)})`;
                else if (end !== start) when = `Del ${longDate(start)} al ${longDate(end)}`;
                const base = {
                    type: 'google', title: g.title, done: false, status: '', link: g.link,
                    pillPrefix: g.allDay ? '' : g.startTime + ' ',
                    fields: [['Horario', when], ['Calendario', g.calendar], ['Lugar', g.location], ['Descripción', g.description]],
                };
                const [y, m, d] = start.split('-').map(Number);
                for (let i = 0; i < 62; i += 1) {
                    const day = toIso(new Date(y, m - 1, d + i));
                    if (day > end) break;
                    const ev = { ...base, date: day, allDay: !!g.allDay };
                    if (!g.allDay) {
                        // Varios días: el primero hasta medianoche, el último desde 00:00, los intermedios completos
                        const sMin = day === start ? toMinutes(g.startTime) : 0;
                        const eMin = day === end ? toMinutes(g.endTime) : 1440;
                        if (day !== start && day !== end) ev.allDay = true;
                        ev.startMin = sMin;
                        ev.endMin = Math.max(eMin, sMin + 15);
                        ev.timeLabel = `${minutesLabel(sMin)} – ${minutesLabel(Math.min(eMin, 1440))}`;
                    }
                    events.push(ev);
                }
            });
            calState.events = events.filter(e => e.date);
            calState.undated = events.filter(e => !e.date && !e.done);
        }

        function visibleEvents(list) {
            const order = Object.keys(CAL_TYPES);
            return list.filter(e => !calState.hidden.has(e.type))
                .sort((a, b) => (a.done - b.done) || (order.indexOf(a.type) - order.indexOf(b.type)));
        }

        function eventsOn(iso) {
            return visibleEvents(calState.events.filter(e => e.date === iso));
        }

        const WEEKDAYS_SHORT = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
        const HOUR_PX = 48;

        // Rango [desde, hasta] (ISO) y texto de la vista activa
        function viewRange() {
            const a = calState.anchor;
            if (calState.view === 'week') {
                const mon = mondayOf(a);
                return { from: toIso(mon), to: toIso(addDays(mon, 6)), label: 'Esta semana' };
            }
            if (calState.view === 'year') {
                return { from: `${a.getFullYear()}-01-01`, to: `${a.getFullYear()}-12-31`, label: 'Este año' };
            }
            return {
                from: toIso(new Date(a.getFullYear(), a.getMonth(), 1)),
                to: toIso(new Date(a.getFullYear(), a.getMonth() + 1, 0)), label: 'Este mes',
            };
        }

        function eventsBetween(from, to) {
            return visibleEvents(calState.events.filter(e => e.date >= from && e.date <= to));
        }

        function renderCalFilters() {
            const wrap = document.getElementById('cal-filters');
            wrap.innerHTML = '';
            const { from, to } = viewRange();
            Object.entries(CAL_TYPES).forEach(([key, t]) => {
                const count = calState.events.filter(e => e.type === key && e.date >= from && e.date <= to).length;
                if (key === 'google' && !count && !(calState.google && calState.google.connected)) return;
                const chip = calEl('span', 'cal-filter' + (calState.hidden.has(key) ? ' off' : ''));
                chip.style.setProperty('--c', t.color);
                chip.title = calState.hidden.has(key) ? 'Mostrar' : 'Ocultar';
                chip.append(calEl('span', 'dot'), calEl('span', '', t.label), calEl('span', 'count', count));
                chip.addEventListener('click', () => {
                    calState.hidden.has(key) ? calState.hidden.delete(key) : calState.hidden.add(key);
                    renderCalendar();
                });
                wrap.appendChild(chip);
            });
        }

        function viewTitle() {
            const a = calState.anchor;
            if (calState.view === 'year') return String(a.getFullYear());
            if (calState.view === 'week') {
                const mon = mondayOf(a), sun = addDays(mon, 6);
                const mName = d => MONTHS[d.getMonth()].slice(0, 3);
                if (mon.getMonth() === sun.getMonth()) return `${mon.getDate()} – ${sun.getDate()} ${cap(MONTHS[sun.getMonth()])} ${sun.getFullYear()}`;
                if (mon.getFullYear() === sun.getFullYear()) return `${mon.getDate()} ${cap(mName(mon))} – ${sun.getDate()} ${cap(mName(sun))} ${sun.getFullYear()}`;
                return `${mon.getDate()} ${cap(mName(mon))} ${mon.getFullYear()} – ${sun.getDate()} ${cap(mName(sun))} ${sun.getFullYear()}`;
            }
            return `${cap(MONTHS[a.getMonth()])} ${a.getFullYear()}`;
        }

        function renderCalendar() {
            calState.year = calState.anchor.getFullYear();
            calState.month = calState.anchor.getMonth();
            document.getElementById('cal-title').textContent = viewTitle();
            document.querySelectorAll('#cal-views button').forEach(b => b.classList.toggle('active', b.dataset.view === calState.view));
            const unit = { week: 'Semana', month: 'Mes', year: 'Año' }[calState.view];
            document.getElementById('cal-prev').title = `${unit} anterior (←)`;
            document.getElementById('cal-next').title = `${unit} siguiente (→)`;
            renderCalFilters();

            const grid = document.getElementById('cal-grid');
            const alt = document.getElementById('cal-alt');
            const isMonth = calState.view === 'month';
            grid.style.display = isMonth ? '' : 'none';
            document.getElementById('cal-weekdays').style.display = isMonth ? '' : 'none';
            alt.classList.toggle('active', !isMonth);
            grid.innerHTML = '';
            alt.innerHTML = '';
            if (calState.error) {
                grid.style.display = '';
                grid.appendChild(calEl('div', 'cal-status', calState.error));
                document.getElementById('cal-footer').innerHTML = '';
                return;
            }
            if (calState.view === 'week') renderWeek(alt);
            else if (calState.view === 'year') renderYear(alt);
            else renderMonth(grid);
            renderCalFooter();
            if (calState.drawerDay) renderDayDrawer();
        }

        function renderCalFooter() {
            const footer = document.getElementById('cal-footer');
            footer.innerHTML = '';
            const { from, to, label } = viewRange();
            const evs = eventsBetween(from, to);
            const pending = evs.filter(e => !e.done).length;
            footer.appendChild(calEl('span', '', evs.length
                ? `${label}: ${evs.length} actividad(es) · ${pending} pendiente(s)`
                : `Sin actividades ${label.toLowerCase()}`));
            const undated = visibleEvents(calState.undated);
            if (undated.length) {
                const b = calEl('button', 'cal-btn', `${undated.length} pendiente(s) sin fecha`);
                b.addEventListener('click', () => openEventList('Pendientes sin fecha', '', undated));
                footer.appendChild(b);
            }
        }

        function makePill(ev) {
            const pill = calEl('div', 'cal-pill' + (ev.done ? ' done' : ''), (ev.pillPrefix || '') + ev.title);
            pill.style.setProperty('--c', CAL_TYPES[ev.type].color);
            pill.title = `${CAL_TYPES[ev.type].label}: ${ev.title}`;
            pill.addEventListener('click', e => { e.stopPropagation(); openEventDetail(ev); });
            return pill;
        }

        // ---- Vista mensual ----
        function renderMonth(grid) {
            const { year, month } = calState;
            const first = new Date(year, month, 1);
            const start = mondayOf(first);
            const weeks = Math.ceil((((first.getDay() + 6) % 7) + new Date(year, month + 1, 0).getDate()) / 7);
            grid.style.gridTemplateRows = `repeat(${weeks}, minmax(0, 1fr))`;
            const todayIso = toIso(new Date());
            // Cuántas actividades caben por día según la altura real de la celda (~19px cada una)
            const cellH = grid.clientHeight / weeks;
            const MAX_PILLS = Math.max(2, Math.floor((cellH - 44) / 19));

            for (let i = 0; i < weeks * 7; i += 1) {
                const d = addDays(start, i);
                const iso = toIso(d);
                const evs = eventsOn(iso);
                const cell = calEl('div', 'cal-day');
                if (d.getMonth() !== month) cell.classList.add('out');
                if (iso === todayIso) cell.classList.add('today');
                if (iso === calState.drawerDay) cell.classList.add('selected');
                cell.dataset.day = iso;
                cell.appendChild(calEl('span', 'cal-day-num', d.getDate()));
                cell.title = evs.length ? `${evs.length} actividad(es) · clic para ver el día` : 'Ver el día';
                cell.addEventListener('click', () => openDayDrawer(iso));
                evs.slice(0, MAX_PILLS).forEach(ev => cell.appendChild(makePill(ev)));
                if (evs.length > MAX_PILLS) cell.appendChild(calEl('div', 'cal-more', `+${evs.length - MAX_PILLS} más`));
                grid.appendChild(cell);
            }
        }

        // ---- Línea de tiempo (semana o un solo día) ----
        function layoutTimed(evs) {
            // Reparte en carriles los eventos que se solapan
            const sorted = [...evs].sort((a, b) => a.startMin - b.startMin || b.endMin - a.endMin);
            let cluster = [], lanes = [], clusterEnd = -1;
            const flush = () => { cluster.forEach(c => { c.lanes = lanes.length; }); cluster = []; lanes = []; };
            const out = [];
            sorted.forEach(ev => {
                if (ev.startMin >= clusterEnd) { flush(); clusterEnd = -1; }
                let lane = lanes.findIndex(end => end <= ev.startMin);
                if (lane === -1) { lane = lanes.length; lanes.push(0); }
                lanes[lane] = ev.endMin;
                const item = { ev, lane, lanes: 1 };
                cluster.push(item);
                out.push(item);
                clusterEnd = Math.max(clusterEnd, ev.endMin);
            });
            flush();
            return out;
        }

        function buildTimeline(days, { showHead = true } = {}) {
            const todayIso = toIso(new Date());
            const tl = calEl('div', 'tl');
            tl.style.setProperty('--hour', HOUR_PX + 'px');
            tl.style.setProperty('--cols', days.length);

            if (showHead) {
                const head = calEl('div', 'tl-row tl-head');
                head.appendChild(calEl('div'));
                days.forEach(iso => {
                    const d = parseIso(iso);
                    const cell = calEl('div', 'day' + (iso === todayIso ? ' today' : ''));
                    cell.append(document.createTextNode(WEEKDAYS_SHORT[(d.getDay() + 6) % 7]), calEl('span', 'num', d.getDate()));
                    cell.title = 'Ver el día';
                    cell.addEventListener('click', () => openDayDrawer(iso));
                    head.appendChild(cell);
                });
                tl.appendChild(head);

                const allday = calEl('div', 'tl-row tl-allday');
                allday.appendChild(calEl('div', 'lbl', 'Todo el día'));
                days.forEach(iso => {
                    const col = calEl('div', 'col');
                    eventsOn(iso).filter(e => e.allDay || typeof e.startMin !== 'number').forEach(ev => col.appendChild(makePill(ev)));
                    allday.appendChild(col);
                });
                tl.appendChild(allday);
            }

            const scroll = calEl('div', 'tl-scroll');
            const gridRow = calEl('div', 'tl-row tl-grid');
            const hours = calEl('div', 'tl-hours');
            for (let h = 1; h < 24; h += 1) {
                const lbl = calEl('span', '', `${String(h).padStart(2, '0')}:00`);
                lbl.style.top = `${h * HOUR_PX}px`;
                hours.appendChild(lbl);
            }
            gridRow.appendChild(hours);
            let firstMin = 24 * 60, todayFirstMin = 24 * 60;
            days.forEach(iso => {
                const col = calEl('div', 'tl-col' + (iso === todayIso ? ' today' : ''));
                const timed = eventsOn(iso).filter(e => !e.allDay && typeof e.startMin === 'number');
                layoutTimed(timed).forEach(({ ev, lane, lanes }) => {
                    const block = calEl('div', 'tl-ev' + (ev.done ? ' done' : ''));
                    block.style.setProperty('--c', CAL_TYPES[ev.type].color);
                    block.style.top = `${ev.startMin / 60 * HOUR_PX}px`;
                    block.style.height = `${Math.max(22, (ev.endMin - ev.startMin) / 60 * HOUR_PX - 2)}px`;
                    block.style.left = `calc(${(lane / lanes) * 100}% + 2px)`;
                    block.style.width = `calc(${100 / lanes}% - 4px)`;
                    block.title = `${ev.timeLabel || ''} ${ev.title}`.trim();
                    block.append(calEl('span', 't', ev.title), calEl('span', 'h', ev.timeLabel || ''));
                    block.addEventListener('click', e => { e.stopPropagation(); openEventDetail(ev); });
                    col.appendChild(block);
                    firstMin = Math.min(firstMin, ev.startMin);
                    if (iso === todayIso) todayFirstMin = Math.min(todayFirstMin, ev.startMin);
                });
                if (iso === todayIso) {
                    const now = new Date();
                    const line = calEl('div', 'tl-now');
                    line.style.top = `${(now.getHours() * 60 + now.getMinutes()) / 60 * HOUR_PX}px`;
                    col.appendChild(line);
                }
                gridRow.appendChild(col);
            });
            scroll.appendChild(gridRow);
            tl.appendChild(scroll);

            // Desplazamiento inicial: la hora actual si hoy está en la vista; si no, el primer evento o las 8:00
            requestAnimationFrame(() => {
                // Si hoy está en la vista: su primer evento o una hora antes de ahora (lo que ocurra antes).
                // Si no: el primer evento del rango o las 8:00.
                const now = new Date();
                const target = days.includes(todayIso)
                    ? Math.min(todayFirstMin - 30, now.getHours() * 60 + now.getMinutes() - 60)
                    : Math.min(firstMin - 30, 8 * 60);
                scroll.scrollTop = Math.max(0, target / 60 * HOUR_PX);
            });
            return tl;
        }

        // ---- Vista semanal ----
        function renderWeek(alt) {
            const mon = mondayOf(calState.anchor);
            const days = Array.from({ length: 7 }, (_, i) => toIso(addDays(mon, i)));
            alt.appendChild(buildTimeline(days));
        }

        // ---- Vista anual ----
        function renderYear(alt) {
            const year = calState.anchor.getFullYear();
            const todayIso = toIso(new Date());
            const wrap = calEl('div', 'cal-year');
            for (let m = 0; m < 12; m += 1) {
                const card = calEl('div', 'yr-month');
                const from = toIso(new Date(year, m, 1)), to = toIso(new Date(year, m + 1, 0));
                const total = eventsBetween(from, to).length;
                const h = calEl('h5');
                h.append(calEl('span', '', cap(MONTHS[m])), calEl('span', 'count', total ? `${total}` : ''));
                h.title = 'Ver el mes';
                h.addEventListener('click', () => setView('month', new Date(year, m, 1)));
                card.appendChild(h);
                const g = calEl('div', 'yr-grid');
                WEEKDAYS_SHORT.forEach(w => g.appendChild(calEl('div', 'wd', w.charAt(0))));
                const lead = (new Date(year, m, 1).getDay() + 6) % 7;
                for (let i = 0; i < lead; i += 1) g.appendChild(calEl('div', 'yr-day blank', '·'));
                const daysInMonth = new Date(year, m + 1, 0).getDate();
                for (let d = 1; d <= daysInMonth; d += 1) {
                    const iso = toIso(new Date(year, m, d));
                    const n = eventsOn(iso).length;
                    const cell = calEl('div', 'yr-day' + (n ? ` l${n >= 4 ? 3 : n >= 2 ? 2 : 1}` : '') + (iso === todayIso ? ' today' : ''), d);
                    cell.title = n ? `${n} actividad(es)` : 'Sin actividades';
                    cell.addEventListener('click', () => openDayDrawer(iso));
                    g.appendChild(cell);
                }
                card.appendChild(g);
                wrap.appendChild(card);
            }
            alt.appendChild(wrap);
        }

        // ---- Panel lateral: agenda del día ----
        const calDrawer = document.getElementById('cal-drawer');

        function openDayDrawer(iso) {
            calState.drawerDay = iso;
            renderDayDrawer();
            calDrawer.classList.add('open');
            calDrawer.parentElement.classList.add('drawer-open');
            document.querySelectorAll('.cal-day.selected').forEach(c => c.classList.remove('selected'));

        function closeDayDrawer() {
            calState.drawerDay = '';
            calDrawer.classList.remove('open');
            calDrawer.parentElement.classList.remove('drawer-open');

        }

        function shiftDrawerDay(delta) {
            if (calState.drawerDay) openDayDrawer(toIso(addDays(parseIso(calState.drawerDay), delta)));
        }

        function renderDayDrawer() {
            const iso = calState.drawerDay;
            calDrawer.innerHTML = '';
            const head = calEl('div', 'cal-drawer-head');
            const prev = calEl('button', 'cal-btn', '‹');

            prev.addEventListener('click', () => shiftDrawerDay(-1));
            const next = calEl('button', 'cal-btn', '›');
            next.title = 'Día siguiente';

            head.append(prev, calEl('h4', '', longDate(iso)), next, close);

            const evs = eventsOn(iso);

                ? `${evs.length} actividad(es) · ${pending} pendiente(s)` : 'Sin actividades este día'));

            const allDay = evs.filter(e => e.allDay || typeof e.startMin !== 'number');

            allDay.forEach(ev => {
                const item = calEl('div', 'cal-list-item' + (ev.done ? ' done' : ''));
                item.style.setProperty('--c', CAL_TYPES[ev.type].color);
                item.append(calEl('span', 'dot'), calEl('span', 't', ev.title), calEl('span', 's', ev.status || CAL_TYPES[ev.type].label));
                item.title = CAL_TYPES[ev.type].label;
                item.addEventListener('click', () => openEventDetail(ev));
                list.appendChild(item);
            });
            calDrawer.appendChild(list);
            calDrawer.appendChild(calEl('div', 'section', 'Horario'));
            calDrawer.appendChild(buildTimeline([iso], { showHead: false }));
        }

        function setView(view, anchor) {
            calState.view = view;
            if (anchor) calState.anchor = anchor;
            try { localStorage.setItem('mcCalendarView', view); } catch (_) {}
            renderCalendar();
        }

        // ---- Modal de detalle / lista ----
        const calDetailOverlay = document.getElementById('cal-detail-overlay');
        const calDetail = document.getElementById('cal-detail');

        function closeCalDetail() { googlePanelOpen = false; calDetailOverlay.classList.remove('active'); }

        // Texto con enlaces http(s) clicables (se abren en pestaña nueva). El resto
        // se inserta como texto; los enlaces largos se muestran abreviados.
        const URL_RE = /https?:\/\/[^\s<>"']+/g;

        function shortUrl(url) {
            try {
                const u = new URL(url);
                const path = decodeURIComponent(u.pathname).replace(/\/$/, '');
                const text = u.host + (path.length > 28 ? path.slice(0, 28) + '…' : path);
                return (u.search || u.hash) && path.length <= 28 ? text + '…' : text;
            } catch { return url.length > 60 ? url.slice(0, 57) + '…' : url; }
        }

        async function copyText(text) {
            // Primero la copia directa: funciona con el clic del usuario y no pide
            // permiso (navigator.clipboard puede quedar esperando uno en páginas internas).
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
            document.body.appendChild(ta);
            ta.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
            ta.remove();
            if (ok) return true;
            try {
                await Promise.race([
                    navigator.clipboard.writeText(text),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 1500)),
                ]);
                return true;
            } catch (_) {
                return false;
            }
        }

        function copyLinkButton(url) {
            const b = calEl('button', 'cal-copy-btn');
            b.type = 'button';
            b.title = 'Copiar enlace';
            b.setAttribute('aria-label', 'Copiar enlace');
            const icon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
            b.innerHTML = icon;
            let timer = null;
            b.addEventListener('click', async e => {
                e.preventDefault();
                e.stopPropagation();
                const ok = await copyText(url);
                b.classList.toggle('copied', ok);
                b.textContent = ok ? '✓ Copiado' : 'No se pudo copiar';
                clearTimeout(timer);
                timer = setTimeout(() => { b.classList.remove('copied'); b.innerHTML = icon; }, 1600);
            });
            return b;
        }

        function linkifiedDd(value) {
            const dd = calEl('dd');
            const text = String(value);
            let last = 0;
            for (const m of text.matchAll(URL_RE)) {
                const url = m[0].replace(/[).,;:!?\]]+$/, '');  // puntuación final no es parte del enlace
                if (m.index > last) dd.append(document.createTextNode(text.slice(last, m.index)));
                const a = calEl('a', '', shortUrl(url));
                a.title = url;
                a.addEventListener('click', e => { e.preventDefault(); window.open(url, '_blank'); });
                dd.append(a, copyLinkButton(url));
                last = m.index + url.length;
            }
            if (last < text.length) dd.append(document.createTextNode(text.slice(last)));
            return dd;
        }

        function detailActions(buttons) {
            const row = calEl('div', 'cal-detail-actions');
            buttons.forEach(([text, fn, cls]) => {
                const b = calEl('button', 'cal-btn' + (cls ? ' ' + cls : ''), text);
                b.addEventListener('click', fn);
                row.appendChild(b);
            });
            return row;
        }

        function openEventDetail(ev, back = null) {
            const t = CAL_TYPES[ev.type];
            calDetail.innerHTML = '';
            calDetail.style.setProperty('--c', t.color);
            const type = calEl('div', 'cal-detail-type');
            type.append(calEl('span', 'dot'), calEl('span', '', t.label));
            const title = calEl('h4', ev.done ? 'done' : '', ev.title);
            calDetail.append(type, title);
            if (ev.date) calDetail.appendChild(calEl('div', 'cal-detail-date', longDate(ev.date)));

            const dl = calEl('dl', 'cal-fields');
            if (ev.status) {
                dl.append(calEl('dt', '', 'Estado'));
                const dd = calEl('dd');
                dd.appendChild(calEl('span', 'cal-badge', ev.status));
                dl.appendChild(dd);
            }
            ev.fields.filter(([, v]) => v !== undefined && v !== null && String(v).trim() !== '')
                .forEach(([k, v]) => dl.append(calEl('dt', '', k), linkifiedDd(v)));
            calDetail.appendChild(dl);

            const buttons = [];
            if (back) buttons.push(['‹ Volver', back]);
            buttons.push(['Cerrar', closeCalDetail]);
            if (ev.type === 'google') {
                if (/^https:\/\/(www\.)?google\.com\/calendar\//.test(ev.link || '')) {
                    buttons.push(['Abrir en Google Calendar', () => window.open(ev.link, '_blank'), 'primary']);
                }
            } else {
                buttons.push([`Abrir en ${t.label}`, () => goToAgendaTab(t.tab), 'primary']);
            }
            calDetail.appendChild(detailActions(buttons));
            calDetailOverlay.classList.add('active');
        }

        function openEventList(heading, subheading, list) {
            calDetail.innerHTML = '';
            calDetail.style.removeProperty('--c');
            calDetail.appendChild(calEl('h4', '', heading));
            if (subheading) calDetail.appendChild(calEl('div', 'cal-detail-date', subheading));
            const wrap = calEl('div', 'cal-list');
            list.forEach(ev => {
                const item = calEl('div', 'cal-list-item' + (ev.done ? ' done' : ''));
                item.style.setProperty('--c', CAL_TYPES[ev.type].color);
                item.append(calEl('span', 'dot'), calEl('span', 't', ev.title), calEl('span', 's', ev.status));
                item.title = CAL_TYPES[ev.type].label;
                item.addEventListener('click', () => openEventDetail(ev, () => openEventList(heading, subheading, list)));
                wrap.appendChild(item);
            });
            calDetail.appendChild(wrap);
            calDetail.appendChild(detailActions([['Cerrar', closeCalDetail]]));
            calDetailOverlay.classList.add('active');
        }

        // ---- Google Calendar ----
        let googlePanelOpen = false;
        const GOOGLE_AUTO_SYNC_MIN = 10;  // al abrir el calendario, sincroniza si pasó más de esto

        async function refreshGoogleStatus() {
            const py = await calBridge;
            if (!py || !py.google_status) return null;
            try { calState.google = JSON.parse(await py.google_status()); } catch (_) { calState.google = null; }
            const g = calState.google || {};
            const btn = document.getElementById('cal-google');
            btn.classList.toggle('connected', !!g.connected && !g.error);
            btn.classList.toggle('busy', !!g.busy);
            btn.classList.toggle('error', !!g.error);
            btn.title = g.busy === 'syncing' ? 'Sincronizando con Google…'
                : g.connected ? `Conectado a Google${g.email ? ' como ' + g.email : ''}` : 'Conectar con Google Calendar';
            return g;
        }

        function formatSyncTime(iso) {
            if (!iso) return 'nunca';
            const d = new Date(iso);
            return isNaN(d) ? iso : d.toLocaleString('es', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        }

        function gsLink(text, url) {
            const a = calEl('a', '', text);
            a.addEventListener('click', () => window.open(url, '_blank'));
            return a;
        }

        function gsStep(...parts) {
            const li = document.createElement('li');
            parts.forEach(p => li.append(typeof p === 'string' ? document.createTextNode(p) : p));
            return li;
        }

        async function renderGooglePanel() {
            const py = await calBridge;
            const g = await refreshGoogleStatus() || {};
            if (!googlePanelOpen) return;
            calDetail.innerHTML = '';
            calDetail.style.setProperty('--c', '#4285f4');
            const type = calEl('div', 'cal-detail-type');
            type.append(calEl('span', 'dot'), calEl('span', '', 'Google Calendar'));
            calDetail.append(type);
            const buttons = [];
            const close = () => { googlePanelOpen = false; closeCalDetail(); };

            if (g.connected) {
                calDetail.appendChild(calEl('h4', '', g.email ? `Conectado como ${g.email}` : 'Cuenta conectada'));
                calDetail.appendChild(calEl('div', 'gs-text',
                    g.busy === 'syncing' ? 'Sincronizando…' : `Última sincronización: ${formatSyncTime(g.lastSync)}`));
                calDetail.appendChild(calEl('div', 'gs-muted',
                    `${g.events} evento(s) de Google en el calendario · ${g.pushed} actividad(es) de Minichrome enviadas al calendario «Minichrome» de tu cuenta.`));
                calDetail.appendChild(calEl('div', 'gs-muted',
                    'Las actividades se sincronizan de Minichrome hacia Google: los cambios que hagas a esas copias en Google se reemplazan en la siguiente sincronización. Tus otros calendarios de Google no se modifican.'));
                buttons.push(['Desconectar', () => { if (confirmDisconnect()) py.google_disconnect(); }, 'danger']);
                buttons.push(['Cerrar', close]);
                buttons.push([g.busy === 'syncing' ? 'Sincronizando…' : 'Sincronizar ahora', () => py.google_sync(), 'primary']);
            } else if (g.busy === 'connecting') {
                calDetail.appendChild(calEl('h4', '', 'Esperando autorización…'));
                calDetail.appendChild(calEl('div', 'gs-text',
                    'Se abrió el inicio de sesión de Google en tu navegador. Elige tu cuenta y concede el acceso; al terminar, vuelve aquí.'));
                calDetail.appendChild(calEl('div', 'gs-muted',
                    'Google avisará que «no verificó esta app»: es normal porque es tu propia app. Pulsa «Configuración avanzada» → «Ir a …».'));
                buttons.push(['Cancelar', () => py.google_cancel_connect()]);
            } else {
                calDetail.appendChild(calEl('h4', '', 'Conectar con Google Calendar'));
                calDetail.appendChild(calEl('div', 'gs-text',
                    'Tus eventos de Google aparecerán en este calendario, y tus actividades con fecha se copiarán a un calendario «Minichrome» en tu cuenta.'));
                if (!g.configured) {
                    calDetail.appendChild(calEl('div', 'gs-muted', 'Configuración única (unos 5 minutos). Google exige que cada usuario cree sus propias credenciales:'));
                    const ol = calEl('ol', 'gs-steps');
                    ol.append(
                        gsStep(gsLink('Crea un proyecto', 'https://console.cloud.google.com/projectcreate'), ' en Google Cloud (por ejemplo «Minichrome»).'),
                        gsStep(gsLink('Activa Google Calendar API', 'https://console.cloud.google.com/apis/library/calendar-json.googleapis.com'), ' en ese proyecto.'),
                        gsStep('En ', gsLink('Google Auth Platform', 'https://console.cloud.google.com/auth/overview'), ' configura la pantalla de consentimiento como ', calEl('b', '', 'Externa'), ' y agrega tu correo en «Público → Usuarios de prueba».'),
                        gsStep('En ', gsLink('Clientes', 'https://console.cloud.google.com/auth/clients'), ' crea un cliente de tipo ', calEl('b', '', 'App de escritorio'), ' y descarga el JSON.'),
                        gsStep('Pulsa ', calEl('b', '', '«Elegir archivo JSON…»'), ' aquí abajo y selecciónalo.'),
                    );
                    calDetail.appendChild(ol);
                    calDetail.appendChild(calEl('div', 'gs-muted',
                        'Mientras la app esté en modo «Prueba», Google pide volver a conectar cada 7 días; para evitarlo, en «Público» pulsa «Publicar app». El archivo y la sesión se guardan en el llavero del sistema.'));
                } else {
                    calDetail.appendChild(calEl('div', 'gs-muted', `Credenciales cargadas (${g.clientId}…). Pulsa «Conectar» para iniciar sesión en tu navegador.`));
                }
                buttons.push(['Cerrar', close]);
                buttons.push([g.configured ? 'Cambiar archivo JSON…' : 'Elegir archivo JSON…', () => py.google_select_credentials(), g.configured ? '' : 'primary']);
                if (g.configured) buttons.push(['Conectar con Google', () => py.google_connect(), 'primary']);
            }
            if (g.error) calDetail.appendChild(calEl('div', 'gs-error', g.error));
            calDetail.appendChild(detailActions(buttons));
            calDetailOverlay.classList.add('active');
        }

        function confirmDisconnect() {
            // Modal nativo simple: la acción es reversible (se puede volver a conectar)
            return window.confirm('¿Desconectar tu cuenta de Google? El calendario «Minichrome» quedará en tu cuenta de Google (puedes borrarlo allí).');
        }

        function openGooglePanel() {
            googlePanelOpen = true;
            renderGooglePanel();
        }

        calBridge.then(py => {
            if (!py || !py.google_changed) return;
            py.google_changed.connect(async () => {
                const g = await refreshGoogleStatus();
                if (googlePanelOpen && calDetailOverlay.classList.contains('active')) renderGooglePanel();
                // Tras sincronizar, recargar lo que muestra el calendario
                if (g && !g.busy && calOverlay.classList.contains('active')) {
                    try { await loadCalendarData(); renderCalendar(); } catch (_) {}
                }
            });
        });

        async function maybeAutoSync() {
            const py = await calBridge;
            const g = await refreshGoogleStatus();
            if (!py || !g || !g.connected || g.busy) return;
            const last = g.lastSync ? new Date(g.lastSync).getTime() : 0;
            if (Date.now() - last > GOOGLE_AUTO_SYNC_MIN * 60000) py.google_sync();
        }

        // ---- Abrir / navegar ----
        const calOverlay = document.getElementById('cal-overlay');

        let calRestoreBar = false;  // la barra estaba visible al abrir el calendario
        const PAGE_TITLE = document.title;

        async function openCalendar() {
            document.title = 'Calendario';  // nombre de la pestaña mientras está abierto
            calBridge.then(async py => {
                if (!py || !py.hide_browser_bar) return;
                calRestoreBar = py.is_browser_bar_open ? await py.is_browser_bar_open() : false;
                if (calRestoreBar) py.hide_browser_bar();
            });
            calState.anchor = new Date();
            calState.error = '';
            closeDayDrawer();
            calOverlay.classList.add('active');
            document.getElementById('cal-grid').innerHTML = '<div class="cal-status">Cargando actividades…</div>';
            maybeAutoSync();
            try {
                await loadCalendarData();
            } catch (err) {
                calState.error = 'No se pudieron cargar las actividades: ' + (err && err.message ? err.message : err);
            }
            renderCalendar();
        }

        function closeCalendar() {
            closeCalDetail();
            closeDayDrawer();
            calOverlay.classList.remove('active');
            document.title = PAGE_TITLE;
            if (calRestoreBar) {
                calRestoreBar = false;
                calBridge.then(py => py && py.show_browser_bar && py.show_browser_bar());
            }
        }

        function shiftPeriod(delta) {
            const a = calState.anchor;
            if (calState.view === 'week') calState.anchor = addDays(a, 7 * delta);
            else if (calState.view === 'year') calState.anchor = new Date(a.getFullYear() + delta, a.getMonth(), 1);
            else calState.anchor = new Date(a.getFullYear(), a.getMonth() + delta, 1);
            renderCalendar();
        }

        const clockWrap = document.getElementById('clock-wrap');
        clockWrap.addEventListener('click', openCalendar);
        clockWrap.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCalendar(); } });
        document.getElementById('cal-prev').addEventListener('click', () => shiftPeriod(-1));
        document.getElementById('cal-next').addEventListener('click', () => shiftPeriod(1));
        document.getElementById('cal-today').addEventListener('click', () => {
            calState.anchor = new Date();
            renderCalendar();
            if (calState.drawerDay) openDayDrawer(toIso(new Date()));
        });
        document.querySelectorAll('#cal-views button').forEach(b =>
            b.addEventListener('click', () => setView(b.dataset.view)));
        document.getElementById('cal-close').addEventListener('click', closeCalendar);
        document.getElementById('cal-google').addEventListener('click', openGooglePanel);
        calOverlay.addEventListener('click', e => { if (e.target === calOverlay) closeCalendar(); });
        calDetailOverlay.addEventListener('click', e => { if (e.target === calDetailOverlay) closeCalDetail(); });

        document.addEventListener('keydown', e => {
            if (!calOverlay.classList.contains('active')) return;
            if (e.key === 'Escape') {
                e.preventDefault();  // que Esc no oculte también la barra del navegador
                if (calDetailOverlay.classList.contains('active')) closeCalDetail();
                else if (calState.drawerDay) closeDayDrawer();
                else closeCalendar();
            } else if (!calDetailOverlay.classList.contains('active') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
                e.preventDefault();
                const delta = e.key === 'ArrowLeft' ? -1 : 1;
                // Con el panel del día abierto, las flechas cambian de día
                calState.drawerDay ? shiftDrawerDay(delta) : shiftPeriod(delta);
            }
        });
    </script>
</body>
</html>
